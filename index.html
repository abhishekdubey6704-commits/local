<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Image Example</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      font-family: sans-serif;
      color: white;
    }

    .content {
      text-align: center;
      padding-top: 40vh;
      font-size: 2em;
      text-shadow: 2px 2px 4px #000;
    }
  </style>
</head>
<body>
  <div class="content">
    Welcome to My App
  </div>
</body>
</html>
